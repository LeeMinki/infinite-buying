name: Deploy Main

on:
  push:
    branches:
      - main

permissions:
  contents: write
  packages: write

jobs:
  deploy:
    name: Publish images and update GitOps state
    runs-on: ubuntu-latest
    if: ${{ !contains(github.event.head_commit.message, '[skip deploy]') }}
    timeout-minutes: 45
    env:
      REGISTRY: yny.ocir.io
      OWNER: axnyuujz40an
      BACKEND_IMAGE: infinite-buying-backend
      FRONTEND_IMAGE: infinite-buying-frontend
      IMAGE_TAG: ${{ github.sha }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to OCIR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.OCI_OCIR_USERNAME }}
          password: ${{ secrets.OCI_OCIR_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.BACKEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VITE_API_BASE=/
          tags: ${{ env.REGISTRY }}/${{ env.OWNER }}/${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Update GitOps image tags
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("infra/kubernetes/infinite-buying/overlays/mvp/kustomization.yaml")
          registry = "${{ env.REGISTRY }}/${{ env.OWNER }}"
          image_tag = "${{ env.IMAGE_TAG }}"
          lines = path.read_text().splitlines()
          current_image = None
          next_lines = []

          for line in lines:
              stripped = line.strip()
              if (stripped.startswith("name: ") or stripped.startswith("- name: ")) and "infinite-buying-backend" in stripped:
                  current_image = "backend"
              elif (stripped.startswith("name: ") or stripped.startswith("- name: ")) and "infinite-buying-frontend" in stripped:
                  current_image = "frontend"

              if stripped.startswith("newName: ") and current_image == "backend":
                  next_lines.append(f"    newName: {registry}/infinite-buying-backend")
                  continue

              if stripped.startswith("newName: ") and current_image == "frontend":
                  next_lines.append(f"    newName: {registry}/infinite-buying-frontend")
                  continue

              if stripped.startswith("newTag: ") and current_image in {"backend", "frontend"}:
                  next_lines.append(f"    newTag: {image_tag}")
                  continue

              next_lines.append(line)

          path.write_text("\n".join(next_lines) + "\n")
          PY

      - name: Setup kubectl
        uses: azure/setup-kubectl@v4

      - name: Validate rendered manifests
        run: kubectl kustomize infra/kubernetes/infinite-buying/overlays/mvp > /tmp/infinite-buying-mvp.yaml

      - name: Commit GitOps update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add infra/kubernetes/infinite-buying/overlays/mvp/kustomization.yaml
          git commit -m "chore: update mvp image tags [skip deploy]" || exit 0
          git push
