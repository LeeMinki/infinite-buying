apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: infinite-buying
resources:
  - ../../base
patches:
  - path: patches/ingress-tls.yaml
    target:
      kind: Ingress
      name: infinite-buying
  - path: patches/ingress-www-tls.yaml
    target:
      kind: Ingress
      name: infinite-buying-www
images:
  - name: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/infinite-buying-backend
    newName: ghcr.io/leeminki/infinite-buying-backend
    newTag: 9bcd23a0ce85081e2c403a95f6f5f94bfc4341bd
  - name: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/infinite-buying-frontend
    newName: ghcr.io/leeminki/infinite-buying-frontend
    newTag: 9bcd23a0ce85081e2c403a95f6f5f94bfc4341bd
