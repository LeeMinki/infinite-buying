apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinite-buying-backend
  namespace: infinite-buying
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: infinite-buying-backend
  template:
    metadata:
      labels:
        app: infinite-buying-backend
    spec:
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: backend
          image: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/infinite-buying-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: infinite-buying-config
            - secretRef:
                name: infinite-buying-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: backend-data
              mountPath: /var/lib/infinite-buying/backend
      volumes:
        - name: backend-data
          hostPath:
            path: /var/lib/infinite-buying/backend
            type: DirectoryOrCreate
