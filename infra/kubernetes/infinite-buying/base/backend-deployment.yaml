apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinite-buying-backend
  namespace: infinite-buying
spec:
  replicas: 1
  strategy:
    # SQLite와 프로세스별 KIS 호출 큐를 공유하는 scheduler는 한 번에 하나만 실행한다.
    # 배포 중 짧은 API 중단을 허용하고 이전 Pod 종료 후 새 Pod를 시작한다.
    type: Recreate
  selector:
    matchLabels:
      app: infinite-buying-backend
  template:
    metadata:
      labels:
        app: infinite-buying-backend
      annotations:
        infinite-buying/config-revision: kr-live-retry-20260826
    spec:
      dnsConfig:
        options:
          - name: ndots
            value: "1"
      containers:
        - name: backend
          image: infinite-buying-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 3001
          envFrom:
            - configMapRef:
                name: infinite-buying-config
            - secretRef:
                name: infinite-buying-secrets
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          volumeMounts:
            - name: backend-data
              mountPath: /var/lib/infinite-buying/backend
      volumes:
        - name: backend-data
          hostPath:
            path: /var/lib/infinite-buying/backend
            type: DirectoryOrCreate
