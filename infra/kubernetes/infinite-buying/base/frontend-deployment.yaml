apiVersion: apps/v1
kind: Deployment
metadata:
  name: infinite-buying-frontend
  namespace: infinite-buying
spec:
  replicas: 1
  selector:
    matchLabels:
      app: infinite-buying-frontend
  template:
    metadata:
      labels:
        app: infinite-buying-frontend
    spec:
      imagePullSecrets:
        - name: ecr-registry
      containers:
        - name: frontend
          image: 000000000000.dkr.ecr.ap-northeast-2.amazonaws.com/infinite-buying-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
