apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: infinite-buying-ip-fallback
  namespace: infinite-buying
spec:
  ingressClassName: traefik
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: infinite-buying-backend
                port:
                  number: 3001
          - path: /
            pathType: Prefix
            backend:
              service:
                name: infinite-buying-frontend
                port:
                  number: 80
