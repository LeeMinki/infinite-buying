apiVersion: v1
kind: ConfigMap
metadata:
  name: infinite-buying-config
  namespace: infinite-buying
data:
  NODE_ENV: production
  PORT: "3001"
  DB_PATH: /var/lib/infinite-buying/backend/app.db
  MARKET_DATA_PROVIDER: mock
  KIWOOM_BASE_URL: https://api.kiwoom.com
  KIWOOM_MOCK_BASE_URL: https://mockapi.kiwoom.com
  KIWOOM_TIMEOUT_MS: "5000"
  KIWOOM_USE_MOCK: "false"
