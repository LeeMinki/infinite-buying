apiVersion: v1
kind: ConfigMap
metadata:
  name: infinite-buying-config
  namespace: infinite-buying
data:
  NODE_ENV: production
  PORT: "3001"
  DB_PATH: /var/lib/infinite-buying/backend/app.db
  KIS_API_BASE_URL: https://openapi.koreainvestment.com:9443
  KIS_TIMEOUT_MS: "5000"
  SESSION_COOKIE_SECURE: "true"
  ENABLE_LIVE_ORDER: "true"
  ENABLE_RESERVED_ORDER: "false"
  # time-split validation 미통과: 실제 랭킹은 shadow 저장하되 5분 live 후보 재탐색은 잠근다.
  KR_RANK_LIVE_ENTRY_RETRY_ENABLED: "false"
  # ACCEPTED/FILLED 상태 머신과 외부 동일종목 provenance 보강 전까지 라오어 신규 live 주문 금지.
  LAOR_LIVE_ORDER_ENABLED: "false"
