apiVersion: v1
kind: ConfigMap
metadata:
  name: study-note-config
  namespace: study-note
data:
  NODE_ENV: production
  PORT: "3001"
  DB_PATH: /var/lib/study-note/backend/app.db
  MARKET_DATA_PROVIDER: mock
  KIWOOM_BASE_URL: https://api.kiwoom.com
  KIWOOM_MOCK_BASE_URL: https://mockapi.kiwoom.com
  KIWOOM_TIMEOUT_MS: "5000"
  KIWOOM_USE_MOCK: "false"
